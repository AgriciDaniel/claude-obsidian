*{box-sizing:border-box;margin:0;padding:0}

.info{padding:10px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.tt{font-size:13px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:11px;color:#888}
.price{font-size:14px;font-weight:600;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.b{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:500}
.b-s{background:#eef2f7;color:#33598a}
.b-g{background:#f0ece6;color:#7a5b34}
.flag{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600;background:#fbeaea;color:#c0392b}

const SN={'OutletShop':'Outlet','UniformesShop':'Uniformes','FraganciasShop':'Fragancias','CapShop':'Caps','(SIN TIENDA)':'Sin tienda','-':'Sin tienda'};
const GN={'H':'Hombre','M':'Mujer','U':'Unisex','X':'Mixto','-':'—'};
const FN={'p0':'precio $0','mt':'2 tiendas','ar':'archivado','pf':'0-1 foto','hf':'huérfano','ag':'agotado'};
const state={q:'',s:'',b:'',c:'',g:'',flags:new Set()};
function uniq(k){return [...new Set(D.map(x=>x[k]).filter(v=>v&&v!=='-'))].sort()}
function fill(id,vals){const el=document.getElementById(id);vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)})}
fill('fs',uniq('s'));fill('fb',uniq('b'));fill('fc',uniq('c'));
const fdiv=document.getElementById('flags');
Object.keys(FN).forEach(f=>{const c=document.createElement('span');c.className='chip';c.textContent=FN[f];c.onclick=()=>{c.classList.toggle('on');if(state.flags.has(f))state.flags.delete(f);else state.flags.add(f);render()};fdiv.appendChild(c)});
function metrics(){
 const m=document.getElementById('metrics');
 const by=t=>D.filter(x=>x.s===t).length;
 const fl=f=>D.filter(x=>x.f.includes(f)).length;
 const cards=[['585','productos'],[by('OutletShop'),'Outlet'],[by('UniformesShop'),'Uniformes'],[by('FraganciasShop'),'Fragancias'],[by('CapShop'),'Caps'],[D.filter(x=>x.s==='(SIN TIENDA)').length,'Sin tienda',1],[fl('pf'),'0-1 foto',1],[fl('ag'),'agotados',1]];
 m.innerHTML=cards.map(c=>`<div class="metric ${c[2]?'warn':''}"><div class="n">${c[0]}</div><div class="l">${c[1]}</div></div>`).join('');
}
function render(){
 let r=D.filter(x=>{
  if(state.s&&x.s!==state.s)return 0;
  if(state.b&&x.b!==state.b)return 0;
  if(state.c&&x.c!==state.c)return 0;
  if(state.g&&x.g!==state.g)return 0;
  for(const f of state.flags)if(!x.f.includes(f))return 0;
  if(state.q){const q=state.q.toLowerCase();if(!(x.t+' '+x.b+' '+x.c).toLowerCase().includes(q))return 0}
  return 1});
 document.getElementById('count').textContent=r.length+' productos';
 document.getElementById('grid').innerHTML=r.slice(0,600).map(x=>{
  const img=x.im?`<img loading="lazy" src="${BASE+x.im}${x.im.includes('?')?'&':'?'}width=400" onerror="this.parentNode.innerHTML='<span class=ph>sin imagen</span>'">`:'<span class="ph">sin imagen</span>';
  const fl=x.f.map(f=>`<span class="flag ${f}">${FN[f]}</span>`).join('');
  return `<a class="card" href="https://www.konpreshop.mx/products/${x.h}" target="_blank">
   <div class="thumb">${img}</div>
   <div class="info"><div class="tt">${x.t}</div>
   <div class="meta">${x.b}</div>
   <div class="price">$${x.p.toLocaleString('es-MX')} <span style="font-size:11px;color:#999;font-weight:400">· ${x.i} stock</span></div>
   <div class="badges"><span class="b b-s">${SN[x.s]||x.s}</span>${x.g!=='-'?`<span class="b b-g">${GN[x.g]}</span>`:''}</div>
   ${fl?`<div class="badges">${fl}</div>`:''}</div></a>`}).join('');
}
document.getElementById('q').oninput=e=>{state.q=e.target.value;render()};
document.getElementById('fs').onchange=e=>{state.s=e.target.value;render()};
document.getElementById('fb').onchange=e=>{state.b=e.target.value;render()};
document.getElementById('fc').onchange=e=>{state.c=e.target.value;render()};
document.getElementById('fg').onchange=e=>{state.g=e.target.value;render()};
metrics();render();
</script></body></html>
