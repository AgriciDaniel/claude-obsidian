[project]
name = "claude-obsidian"
version = "1.9.2"
description = "Claude + Obsidian vault tooling: hybrid retrieval, DragonScale memory, transport detection."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
co-retrieve = "claude_obsidian.retrieve:main"
co-bm25 = "claude_obsidian.bm25_index:main"
co-rerank = "claude_obsidian.rerank:main"
co-contextual = "claude_obsidian.contextual_prefix:main"
co-boundary = "claude_obsidian.boundary_score:cli"
co-tiling = "claude_obsidian.tiling_check:cli"
co-mode = "claude_obsidian.wiki_mode:main"
co-baseline = "claude_obsidian.baseline_v16:main"
co-benchmark = "claude_obsidian.benchmark_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_obsidian"]
